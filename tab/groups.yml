# Must be in plugins/TAB/groups.yml (alongside config.yml), then /tab reload
#
# Uses ViaVersion's PlaceholderAPI expansion (not TAB's %player-version%).
# TAB's own placeholder prints "Unknown" when the client protocol is newer
# than TAB's built-in list — ViaVersion's list stays current.
#
# One-time setup on the SAME server as TAB + ViaVersion:
#   /papi ecloud download ViaVersion
#   /papi reload
#   /tab reload
#
# Or apply in-game:
#   /tab group _DEFAULT_ tabprefix "&8[&7%viaversion_player_protocol_version%&8] "

Owner:
  tabprefix: "&8[&7%viaversion_player_protocol_version%&8] "
Admin:
  tabprefix: "&8[&7%viaversion_player_protocol_version%&8] "
Mod:
  tabprefix: "&8[&7%viaversion_player_protocol_version%&8] "
Helper:
  tabprefix: "&8[&7%viaversion_player_protocol_version%&8] "
builder:
  tabprefix: "&8[&7%viaversion_player_protocol_version%&8] "
vip:
  tabprefix: "&8[&7%viaversion_player_protocol_version%&8] "
default:
  tabprefix: "&8[&7%viaversion_player_protocol_version%&8] "

_DEFAULT_:
  tabprefix: "&8[&7%viaversion_player_protocol_version%&8] "
