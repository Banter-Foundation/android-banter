# Vanilla-style TAB config
#
# IMPORTANT: also install groups.yml from this folder into plugins/TAB/
# (version next to names is configured there, not in this file).
# Then run: /tab reload
#
# No PlaceholderAPI needed. Version uses %player-version-id% (ViaVersion
# protocol id) + the map below. ViaVersion must be on the SAME server as TAB.

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Header-&-Footer
header-footer:
  enabled: true
  designs:
    default:
      header: []
      footer:
        - ""
        - "&7Memory: &f%memory-used%&7/&f%memory-max% MB"
        - "&7Online: &f%online% &8| &7Ping: &f%ping%ms"

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Tablist-name-formatting
# Prefix/suffix live in groups.yml (_DEFAULT_ tabprefix = client version)
tablist-name-formatting:
  enabled: true
  disable-condition: '%world%=disabledworld'

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Nametags
scoreboard-teams:
  enabled: true
  enable-collision: true
  invisible-nametags: false
  sorting-types:
    - "PLACEHOLDER_A_TO_Z:%player%"
  case-sensitive-sorting: false
  can-see-friendly-invisibles: false
  disable-condition: '%world%=disabledworld'

# Vanilla already shows ping bars — leave this off
playerlist-objective:
  enabled: false
  value: "%ping%"
  fancy-value: "&7%ping%"
  title: "TAB"
  render-type: INTEGER
  disable-condition: '%world%=disabledworld'

belowname-objective:
  enabled: false
  value: "%health%"
  fancy-value: "&c%health%"
  fancy-value-default: "NPC"
  title: "&cHealth"
  disable-condition: '%world%=disabledworld'

prevent-spectator-effect:
  enabled: false

bossbar:
  enabled: false
  toggle-command: /bossbar
  remember-toggle-choice: false
  hidden-by-default: false
  bars: {}

scoreboard:
  enabled: false
  toggle-command: /sb
  remember-toggle-choice: false
  hidden-by-default: false
  delay-on-join-milliseconds: 0
  scoreboards: {}

layout:
  enabled: false
  direction: COLUMNS
  default-skin: mineskin:37e93c8e12cd426cb28fce31969e0674
  enable-remaining-players-text: true
  remaining-players-text: '... and %s more'
  empty-slot-ping-value: 1000
  layouts: {}

ping-spoof:
  enabled: false
  value: 0

global-playerlist:
  enabled: false
  display-others-as-spectators: false
  display-vanished-players-as-spectators: true
  isolate-unlisted-servers: false
  update-latency: false
  spy-servers: []
  server-groups: {}

placeholders:
  date-format: "dd.MM.yyyy"
  time-format: "HH:mm"
  time-offset: 0
  register-tab-expansion: false
  locale: en-US

# Map raw ViaVersion protocol ids → readable MC versions (no PAPI).
# Unmapped ids still show as the number instead of "Unknown".
